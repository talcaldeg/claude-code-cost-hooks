name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
        exclude:
          # Python 3.8 has no build for the Apple-silicon runners behind macos-latest.
          - os: macos-latest
            python: "3.8"
        include:
          - os: macos-15-intel
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python tests/test_hooks.py
